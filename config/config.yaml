# 触象真实运行参数。模型输入为 absdiff(实时BGR, 空载中值基准)。
app:
  title: "触象 · TouchSign | 视触觉生肖识别系统"
  host: "127.0.0.1"
  port: 8080
  show: true
  reload: false
  native: false
  window_width: 1600
  window_height: 1000
  favicon: "assets/brand/favicon.svg"
sensor:
  camera:
    scan_max_index: 6
    jpeg_quality: 82
    capture_fps: 20
contact:
  calibration_frames: 30
  calibration_max_motion: 3.0
  pixel_threshold: 12.0
  noise_multiplier: 6.0
  min_area: 0.012
  release_area: 0.006
  max_area: 0.70
  min_score: 0.002
  stable_frames: 3
  stable_seconds: 0.20
  max_frame_motion: 0.025
  border_fraction: 0.04
recognition:
  model_path: "models/best.onnx"
  manifest_path: ""       # 默认与模型同名的 .json 校准文件
  confidence_threshold: 0.85
  confirmation_frames: 4
  max_frame_age: 0.5
  history_limit: 4
  log_path: "logs/recognition.csv"
